services:
  - type: web
    name: hrms-api
    runtime: dotnet
    plan: free
    rootDir: .
    buildCommand: dotnet publish src/Api/HRMS.Api/HRMS.Api.csproj -c Release -o ./publish
    startCommand: dotnet ./publish/HRMS.Api.dll
    healthCheckPath: /health/live
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: hrms-db
          property: connectionString
      - key: Redis__ConnectionString
        sync: false
      - key: Cors__AllowedOrigins
        value: '*'
      - key: Jwt__SecretKey
        generateValue: true
      - key: Jwt__Issuer
        value: HRMS-Pro
      - key: Jwt__Audience
        value: hrms-api
      - key: Jwt__ExpirationMinutes
        value: 60

  - type: pgsql
    name: hrms-db
    plan: free
    database: hrms
    user: hrms_admin
