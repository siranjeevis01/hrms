name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: '9.0.x'
  NODE_VERSION: '22'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore .NET dependencies
        run: dotnet restore HRMSPro.sln

      - name: Build .NET solution
        run: dotnet build HRMSPro.sln --configuration Release --no-restore

      - name: Publish API
        run: dotnet publish src/Api/HRMS.Api/HRMS.Api.csproj -c Release -o ./publish

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: hrms-api
          path: ./publish
          retention-days: 3

  deploy-production:
    name: Deploy Backend to Render
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Render
        uses: brentvollebregt/auto-deploy-render@v1
        with:
          service-id: ${{ secrets.RENDER_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}
