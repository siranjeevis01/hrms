name: Deploy Release to Render

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  DOTNET_VERSION: '9.0.x'

jobs:
  deploy:
    name: Deploy Release to Render
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://hrms-30g6.onrender.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Render
        uses: brentvollebregt/auto-deploy-render@v1
        with:
          service-id: ${{ secrets.RENDER_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}
